# ftx-api-gateway: the single public entry point of Futbolix (ADR-004), port 8080.
server:
  port: ${PORT:8080}

spring:
  application:
    name: ftx-api-gateway
  cloud:
    gateway:
      # CORS for the web app (ftx-front runs on another origin in development). Spring Cloud Gateway
      # 2025 reads the "server.webflux" prefix; the short one is kept for older releases.
      server:
        webflux:
          globalcors:
            cors-configurations:
              '[/api/**]':
                allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:5173}
                allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
                allowed-headers: [Authorization, Content-Type, Idempotency-Key, X-Correlation-Id]
                exposed-headers: [X-Correlation-Id, Retry-After]
                allow-credentials: false
                max-age: 3600
      globalcors:
        cors-configurations:
          '[/api/**]':
            allowed-origins: ${GATEWAY_CORS_ORIGINS:http://localhost:5173}
            allowed-methods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
            allowed-headers: [Authorization, Content-Type, Idempotency-Key, X-Correlation-Id]
            exposed-headers: [X-Correlation-Id, Retry-After]
            allow-credentials: false
            max-age: 3600

gateway:
  upstreams:
    # Service names inside the platform network (each service's deploy/compose.yml).
    customers: ${CUSTOMERS_API_URL:http://ftx-customers-api:8081}
    courts: ${COURTS_API_URL:http://ftx-courts-api:8082}
    reservations: ${RESERVATIONS_API_URL:http://ftx-reservations-api:8083}
    schedules: ${SCHEDULES_API_URL:http://ftx-schedules-api:8085}
  rate-limit:
    create-per-minute: ${GATEWAY_RATE_CREATE:10}
    lookup-per-minute: ${GATEWAY_RATE_LOOKUP:30}
    login-per-minute: ${GATEWAY_RATE_LOGIN:10}

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true                    # /actuator/health/liveness and /readiness for the container

logging:
  structured:
    format:
      console: ecs                       # JSON lines (13-operations/observability.md)
